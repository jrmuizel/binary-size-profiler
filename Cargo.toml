[package]
name = "binary-size-profiler"
version = "0.1.0"
authors = ["Jeff Muizelaar <jrmuizel@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wholesym = { git = "https://github.com/mstange/samply", rev = "749a1f814704611e0cb6f8da90cb296835e14ada" }
# wholesym = "0.8.0"
uuid = "1.12"
futures = "0.3.31"
fxprof-processed-profile = { git = "https://github.com/mstange/samply", rev = "749a1f814704611e0cb6f8da90cb296835e14ada" }
# fxprof-processed-profile = { version = "0.8.0", path = "../samply/fxprof-processed-profile" }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros"] }
mimalloc = { version = "*" }
indicatif = "0.17"
memmap2 = "0.9"

[profile.release]
debug = true
